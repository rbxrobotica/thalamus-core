[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thalamus-sdk"
version = "0.1.0"
description = "Thin Python SDK for the Thalamus semantic control layer"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
