[package]
name = "thalamus-postgres-adapter"
version = "0.1.0"
edition = "2021"
description = "Durable Postgres audit store adapter for Thalamus (Jaguar)"
publish = false

[dependencies]
thalamus-core = { path = "../thalamus-core" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]

[[bin]]
name = "thalamus-migrate"
path = "src/bin/thalamus-migrate.rs"
