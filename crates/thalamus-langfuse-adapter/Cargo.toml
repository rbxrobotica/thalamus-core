[package]
name = "thalamus-langfuse-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
thalamus-eval = { path = "../thalamus-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tracing = "0.1"

[dev-dependencies]
mockito = "1"
