[package]
name = "thalamus-litellm-adapter"
version = "0.1.0"
edition = "2021"
description = "BackendPort adapter for the LiteLLM OpenAI-compatible data plane"
publish = false

[dependencies]
thalamus-core = { path = "../thalamus-core" }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
mockito = "1"
uuid = { version = "1", features = ["v4"] }
