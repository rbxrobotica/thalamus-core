[package]
name = "thalamus-eval"
version = "0.1.0"
edition = "2021"
description = "In-memory evaluation port for Thalamus — structured eval records with non-blocking submission"
publish = false

[dependencies]
thalamus-core = { path = "../thalamus-core" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["serde"] }
tracing = "0.1"
crossbeam-channel = "0.5"

[dev-dependencies]
serde_json = "1"
